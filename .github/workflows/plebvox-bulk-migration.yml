name: PlebVox bulk migration

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run PlebVox bulk migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add PlebVox markers to all articles
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          START = '<!-- PLEBVOX:START -->'
          END = '<!-- PLEBVOX:END -->'
          TARGET = 900
          MAX = 1200

          def words(text):
              return len(re.findall(r"\b[\w’'-]+\b", text, re.UNICODE))

          def split_body(body):
              body = body.strip()
              if not body:
                  return []

              # Prefer natural Markdown heading boundaries.
              matches = list(re.finditer(r'(?m)^#{2,3}\s+.+$', body))
              if len(matches) >= 2:
                  sections = []
                  starts = [m.start() for m in matches]
                  if starts[0] > 0:
                      sections.append(body[:starts[0]].strip())
                  for i, start in enumerate(starts):
                      end = starts[i + 1] if i + 1 < len(starts) else len(body)
                      sections.append(body[start:end].strip())

                  chunks, current = [], []
                  current_words = 0
                  for section in sections:
                      sw = words(section)
                      if current and current_words + sw > MAX:
                          chunks.append('\n\n'.join(current).strip())
                          current, current_words = [], 0
                      current.append(section)
                      current_words += sw
                      if current_words >= TARGET:
                          chunks.append('\n\n'.join(current).strip())
                          current, current_words = [], 0
                  if current:
                      chunks.append('\n\n'.join(current).strip())
                  return chunks

              # For prose without headings, split only at paragraph boundaries.
              if words(body) <= MAX:
                  return [body]

              paragraphs = re.split(r'\n\s*\n', body)
              chunks, current = [], []
              current_words = 0
              for para in paragraphs:
                  pw = words(para)
                  if current and current_words + pw > MAX:
                      chunks.append('\n\n'.join(current).strip())
                      current, current_words = [], 0
                  current.append(para)
                  current_words += pw
                  if current_words >= TARGET:
                      chunks.append('\n\n'.join(current).strip())
                      current, current_words = [], 0
              if current:
                  chunks.append('\n\n'.join(current).strip())
              return chunks

          changed = []
          for path in sorted(Path('.').rglob('*.md')):
              if '_posts' not in path.parts or '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              if START in text:
                  continue

              # Preserve YAML front matter outside the PlebVox reading area.
              if text.startswith('---'):
                  end = text.find('\n---', 3)
                  if end == -1:
                      continue
                  front = text[:end + 4]
                  body = text[end + 4:]
              else:
                  front = ''
                  body = text

              chunks = split_body(body)
              if not chunks:
                  continue

              marked = '\n\n'.join(f'{START}\n\n{chunk}\n\n{END}' for chunk in chunks)
              new_text = (front + '\n\n' + marked.strip() + '\n') if front else (marked.strip() + '\n')

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append((str(path), len(chunks)))

          print(f'Updated {len(changed)} articles.')
          for path, count in changed:
              print(f'{path}: {count} PlebVox part(s)')
          PY

      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/plebvox-bulk-migration.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Add PlebVox to all remaining articles"
          git push
