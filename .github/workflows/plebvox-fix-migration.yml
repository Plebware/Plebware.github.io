name: Fix PlebVox migration

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix PlebVox migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pre-migration content and reapply markers exactly
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          PARENT = '8ab5c4444a8cf9484b473ba1a83a650c690cf765'
          START = '<!-- PLEBVOX:START -->'
          END = '<!-- PLEBVOX:END -->'
          TARGET = 900
          MAX = 1200

          subprocess.run(['git', 'fetch', 'origin', PARENT, '--depth=1'], check=True)
          subprocess.run(['git', 'checkout', PARENT, '--', '.'], check=True)

          def words(text):
              return len(re.findall(r"\b[\w’'-]+\b", text, re.UNICODE))

          def split_body(body):
              # Preserve the body exactly except for inserted markers.
              if words(body) <= MAX:
                  return [body]

              matches = list(re.finditer(r'(?m)^#{2,3}\s+.+$', body))
              if len(matches) < 2:
                  return [body]

              sections = []
              starts = [m.start() for m in matches]
              if starts[0] > 0:
                  sections.append(body[:starts[0]])
              for i, start in enumerate(starts):
                  end = starts[i + 1] if i + 1 < len(starts) else len(body)
                  sections.append(body[start:end])

              chunks, current = [], []
              current_words = 0
              for section in sections:
                  sw = words(section)
                  if current and current_words + sw > MAX:
                      chunks.append(''.join(current))
                      current, current_words = [], 0
                  current.append(section)
                  current_words += sw
                  if current_words >= TARGET:
                      chunks.append(''.join(current))
                      current, current_words = [], 0
              if current:
                  chunks.append(''.join(current))
              return chunks

          changed = []
          for path in sorted(Path('.').rglob('*.md')):
              if '_posts' not in path.parts or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if START in text:
                  continue

              if text.startswith('---'):
                  end = text.find('\n---', 3)
                  if end == -1:
                      continue
                  body_start = end + 4
              else:
                  body_start = 0

              body = text[body_start:]
              chunks = split_body(body)
              if not chunks:
                  continue

              if len(chunks) == 1:
                  marked_body = START + '\n' + chunks[0] + END
              else:
                  marked_parts = []
                  for chunk in chunks:
                      marked_parts.append(START + '\n' + chunk + END)
                  marked_body = '\n\n'.join(marked_parts)

              new_text = text[:body_start] + marked_body
              path.write_text(new_text, encoding='utf-8')
              changed.append((str(path), len(chunks)))

          print(f'Restored and updated {len(changed)} articles.')
          for path, count in changed:
              print(f'{path}: {count} PlebVox part(s)')
          PY

      - name: Commit corrected migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/plebvox-fix-migration.yml
          git add -A
          git commit -m "Correct PlebVox markers without content changes"
          git push --force-with-lease
