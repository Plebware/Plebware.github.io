name: One-time PlebVox segmentation audit

on:
  push:
    branches:
      - plebvox-segmentation-audit-2026-09-17

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Segment inadequate PlebVox blocks
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          START = '<!-- PLEBVOX:START -->'
          END = '<!-- PLEBVOX:END -->'
          changed = []
          skipped = []

          def split_front_matter(text):
              m = re.match(r'\A---\n.*?\n---\n', text, re.S)
              if m:
                  return m.group(0), text[m.end():]
              return '', text

          def heading_positions(body):
              positions = []
              in_fence = False
              fence = None
              offset = 0
              for line in body.splitlines(keepends=True):
                  stripped = line.rstrip('\n\r')
                  fm = re.match(r'^\s*(```+|~~~+)', stripped)
                  if fm:
                      mark = fm.group(1)[0]
                      if not in_fence:
                          in_fence, fence = True, mark
                      elif fence == mark:
                          in_fence, fence = False, None
                      offset += len(line)
                      continue
                  if not in_fence:
                      m = re.match(r'^(#{1,3})\s+\S', stripped)
                      if m:
                          positions.append((offset, len(m.group(1))))
                  offset += len(line)
              return positions

          for path in Path('.').glob('**/_posts/*.md'):
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception as exc:
                  skipped.append(f'{path}: read error {exc}')
                  continue

              starts = text.count(START)
              ends = text.count(END)
              if starts == ends and starts >= 2:
                  continue

              front, body = split_front_matter(text)
              positions = heading_positions(body)

              if not positions:
                  if starts == 0 and ends == 0 and body.strip():
                      new_text = front + '\n' + START + '\n\n' + body.strip() + '\n\n' + END + '\n'
                  else:
                      skipped.append(f'{path}: no usable headings')
                      continue
              else:
                  clean = body.replace(START, '').replace(END, '')
                  positions = heading_positions(clean)
                  levels = [level for _, level in positions]
                  if 2 in levels:
                      chosen = [(p, lvl) for p, lvl in positions if lvl <= 2]
                  elif 1 in levels and levels.count(1) > 1:
                      chosen = [(p, lvl) for p, lvl in positions if lvl == 1]
                  else:
                      chosen = positions

                  if not chosen:
                      skipped.append(f'{path}: headings disappeared during cleanup')
                      continue

                  chunks = []
                  first = chosen[0][0]
                  prefix = clean[:first].strip('\n')
                  preface = prefix + '\n\n' if prefix else ''

                  for i, (pos, _) in enumerate(chosen):
                      endpos = chosen[i + 1][0] if i + 1 < len(chosen) else len(clean)
                      part = clean[pos:endpos].strip('\n')
                      if i == 0 and preface:
                          part = preface + part
                      if part.strip():
                          chunks.append(part)

                  new_body = '\n\n'.join(
                      START + '\n\n' + chunk + '\n\n' + END
                      for chunk in chunks
                  )
                  new_text = front + '\n' + new_body.strip() + '\n'

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print(f'PlebVox audit changed {len(changed)} article files.')
          for item in changed:
              print('CHANGED', item)
          print(f'Skipped/left unchanged: {len(skipped)}')
          for item in skipped[:100]:
              print('SKIPPED', item)

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'PlebWare PlebVox Audit'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'actions@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '-u', '--', '.'], check=True)
              subprocess.run(['git', 'commit', '-m', 'Audit and improve PlebVox article segmentation'], check=True)

          workflow = Path('.github/workflows/plebvox-segmentation-audit.yml')
          if workflow.exists():
              workflow.unlink()
              subprocess.run(['git', 'add', str(workflow)], check=True)
              subprocess.run(['git', 'commit', '-m', 'Remove one-time PlebVox audit workflow'], check=True)

          subprocess.run(['git', 'push', 'origin', 'HEAD:plebvox-segmentation-audit-2026-09-17'], check=True)
